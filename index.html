<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ace Is Back! True Tales — coming soon</title>
<meta name="description" content="A pop-art comic series of true rock ’n’ roll tales. Coming soon.">
<meta name="theme-color" content="#000000">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--yel:#ffd60a;--red:#e8262d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#eee}
body{display:grid;place-items:center;min-height:100vh;min-height:100dvh;font:300 15px/1.6 "Inter",system-ui,sans-serif;overflow:hidden}
.sky{position:fixed;inset:0;pointer-events:none;opacity:.45;background-image:radial-gradient(1px 1px at 12% 18%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 72% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 38% 64%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 86% 48%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 22% 82%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 58% 34%,#fff 50%,transparent 51%);background-size:480px 480px;animation:d 180s linear infinite}
@keyframes d{to{background-position:0 -480px}}
main{position:relative;text-align:center;padding:24px}
.bolt{width:34px;height:52px;margin:0 auto 26px;background:var(--yel);clip-path:polygon(40% 0,100% 0,64% 40%,96% 40%,14% 100%,38% 54%,6% 54%);animation:f 4s ease-in-out infinite}
@keyframes f{0%,92%,100%{opacity:.9;filter:none}95%{opacity:1;filter:drop-shadow(0 0 14px var(--yel))}}
h1{margin:0;display:inline-flex;flex-direction:column;align-items:center;font-family:"Bangers",Impact,sans-serif;font-weight:400;line-height:.85;text-transform:uppercase;transform:rotate(-2deg)}
.l1{font-size:clamp(54px,11vw,120px);letter-spacing:2px;color:var(--yel);-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 var(--red),7px 7px 0 #222}
.l2{margin-top:8px;font-size:clamp(18px,3vw,30px);letter-spacing:.34em;padding-left:.34em;color:#f4f4f6}
.soon{margin:40px 0 0;font-size:12px;letter-spacing:.42em;padding-left:.42em;text-transform:uppercase;color:#77778a}
@media (prefers-reduced-motion:reduce){.sky,.bolt{animation:none}}
</style>
</head>
<body>
<div class="sky" aria-hidden="true"></div>
<main>
  <div class="bolt" aria-hidden="true"></div>
  <h1 aria-label="Ace Is Back! True Tales"><span class="l1">Ace Is Back!</span><span class="l2">True Tales</span></h1>
  <p class="soon">Coming soon</p>
</main>
<script src="counter.js"></script>
</body>
</html>
